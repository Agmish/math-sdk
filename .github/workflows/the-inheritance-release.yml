name: The Inheritance release proof

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    paths:
      - ".github/workflows/the-inheritance-release.yml"
      - "games/2_0_The_Inheritance/**"
      - "tools/the-inheritance-release-proof-v2.py"
      - "tools/assemble-the-inheritance-submission.py"
      - "utils/analysis/distribution_functions.py"
      - "utils/rgs_verification.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/the-inheritance-release.yml"
      - "games/2_0_The_Inheritance/**"
      - "tools/the-inheritance-release-proof-v2.py"
      - "tools/assemble-the-inheritance-submission.py"
      - "utils/analysis/distribution_functions.py"
      - "utils/rgs_verification.py"
      - "requirements.txt"

concurrency:
  group: the-inheritance-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: games/2_0_The_Inheritance/frontend/package-lock.json

      - name: Install Math SDK dependencies
        timeout-minutes: 8
        run: |
          mkdir -p artifacts
          set +e
          python -m pip install --upgrade pip > artifacts/pip-bootstrap.log 2>&1
          bootstrap_status=$?
          python -m pip install -r requirements.txt > artifacts/math-dependency-install.log 2>&1
          dependency_status=$?
          python -m pip install -e . > artifacts/math-editable-install.log 2>&1
          editable_status=$?
          cat artifacts/pip-bootstrap.log
          cat artifacts/math-dependency-install.log
          cat artifacts/math-editable-install.log
          if [ $bootstrap_status -ne 0 ] || [ $dependency_status -ne 0 ] || [ $editable_status -ne 0 ]; then
            exit 1
          fi

      - name: Install canonical Front End dependencies
        timeout-minutes: 8
        working-directory: games/2_0_The_Inheritance/frontend
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('games/2_0_The_Inheritance/frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        working-directory: games/2_0_The_Inheritance/frontend
        run: |
          set +e
          npx --no-install playwright-core install --with-deps chromium > ../../../artifacts/playwright-install.log 2>&1
          status=$?
          cat ../../../artifacts/playwright-install.log
          exit $status

      - name: Run canonical Stake release proof
        timeout-minutes: 30
        run: |
          set +e
          python tools/the-inheritance-release-proof-v2.py > artifacts/release-proof.log 2>&1
          status=$?
          cat artifacts/release-proof.log
          exit $status

      - name: Assemble exact Stake ACP roots
        timeout-minutes: 5
        run: python tools/assemble-the-inheritance-submission.py

      - name: Upload Stake submission proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-inheritance-stake-submission
          path: |
            artifacts/the-inheritance-submission/**
            artifacts/the-inheritance-ci-summary.json
            artifacts/pip-bootstrap.log
            artifacts/math-dependency-install.log
            artifacts/math-editable-install.log
            artifacts/playwright-install.log
            artifacts/release-proof.log
            games/2_0_The_Inheritance/frontend/visual-qa/**
          if-no-files-found: warn
